<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 240" width="880" height="240">
  <defs>
    <!-- Sky Gradient -->
    <linearGradient id="skyBrand" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#1E40AF" />
      <stop offset="50%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#E0F2FE" />
    </linearGradient>

    <!-- Outer Shield Rim -->
    <linearGradient id="badgeRimBrand" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <!-- Path Gradient -->
    <linearGradient id="pathBrand" x1="50%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#CBD5E1" />
    </linearGradient>

    <!-- Roof Gradient -->
    <linearGradient id="roofBrand" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#EF4444" />
      <stop offset="100%" stop-color="#B91C1C" />
    </linearGradient>

    <!-- Shadow filter -->
    <filter id="brandShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.2" />
    </filter>

    <clipPath id="circleClipBrand">
      <circle cx="120" cy="120" r="95" />
    </clipPath>
  </defs>

  <!-- Left Icon Emblem (240x240 area, center 120, 120) -->
  <g filter="url(#brandShadow)">
    <circle cx="120" cy="120" r="102" fill="url(#badgeRimBrand)" />
    <circle cx="120" cy="120" r="96" fill="#0284C7" />

    <!-- Clipped Landscape -->
    <g clip-path="url(#circleClipBrand)">
      <!-- Sky -->
      <rect x="20" y="20" width="200" height="200" fill="url(#skyBrand)" />
      
      <!-- Sun Glow -->
      <circle cx="120" cy="105" r="45" fill="#FEF08A" opacity="0.25" />

      <!-- Left Field -->
      <path d="M20 112 Q70 108 110 114 L102 220 L20 220 Z" fill="#10B981" />
      <!-- Right Field -->
      <path d="M220 112 Q170 108 130 114 L138 220 L220 220 Z" fill="#059669" />

      <!-- Path -->
      <polygon points="115,112 125,112 150,220 90,220" fill="url(#pathBrand)" />
      <polygon points="119,114 121,114 122,220 118,220" fill="#10B981" opacity="0.7" />

      <!-- Fences -->
      <path d="M114 113 L89 220" stroke="#FFFFFF" stroke-width="2.5" fill="none" />
      <path d="M126 113 L151 220" stroke="#FFFFFF" stroke-width="2.5" fill="none" />
      <!-- Fence Posts Left -->
      <line x1="113" y1="112" x2="113" y2="117" stroke="#FFFFFF" stroke-width="1.5" />
      <line x1="108" y1="125" x2="107" y2="133" stroke="#FFFFFF" stroke-width="2" />
      <line x1="101" y1="148" x2="99" y2="162" stroke="#FFFFFF" stroke-width="2.5" />
      <line x1="91" y1="184" x2="88" y2="206" stroke="#FFFFFF" stroke-width="3" />
      <!-- Fence Posts Right -->
      <line x1="127" y1="112" x2="127" y2="117" stroke="#FFFFFF" stroke-width="1.5" />
      <line x1="132" y1="125" x2="133" y2="133" stroke="#FFFFFF" stroke-width="2" />
      <line x1="139" y1="148" x2="141" y2="162" stroke="#FFFFFF" stroke-width="2.5" />
      <line x1="149" y1="184" x2="152" y2="206" stroke="#FFFFFF" stroke-width="3" />

      <!-- Home -->
      <rect x="104" y="102" width="32" height="12" rx="1" fill="#F8FAFC" />
      <polygon points="120,86 108,98 132,98" fill="url(#roofBrand)" />
      <polygon points="108,98 98,103 110,103" fill="#DC2626" />
      <polygon points="132,98 142,103 130,103" fill="#B91C1C" />
      <!-- Door -->
      <rect x="117" y="106" width="6" height="8" rx="3" fill="#F59E0B" />
    </g>
  </g>

  <!-- Brand Typography -->
  <!-- Primary Brand Name -->
  <text x="260" y="112" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="56" font-weight="900" letter-spacing="3" fill="#0F172A">
    MARG <tspan fill="#0D9488">RAKSHAK</tspan>
  </text>

  <!-- Hindi Script Subtitle -->
  <text x="262" y="152" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" letter-spacing="1" fill="#64748B">
    मार्ग रक्षक <tspan font-weight="400" fill="#94A3B8">•</tspan> SAFEPATH ECOSYSTEM
  </text>

  <!-- Tagline Badge -->
  <rect x="262" y="172" width="410" height="32" rx="16" fill="#F0FDFA" stroke="#CCFBF1" stroke-width="1" />
  <circle cx="282" cy="188" r="5" fill="#10B981" />
  <text x="296" y="193" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" letter-spacing="0.8" fill="#0F766E">
    OFFLINE CELLULAR SIM-FIRST PERSONAL SAFETY
  </text>
</svg>
