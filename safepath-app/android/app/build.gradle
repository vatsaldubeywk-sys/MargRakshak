apply plugin: "com.android.application"
apply plugin: "com.facebook.react"

android {
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdkVersion rootProject.ext.compileSdkVersion

    namespace "com.safepath"
    defaultConfig {
        applicationId "com.safepath"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 4
        versionName "1.0.3"
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            signingConfig signingConfigs.debug
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }
}

dependencies {
    implementation("com.facebook.react:react-android")

    implementation project(':notifee_react-native')
    implementation project(':react-native-async-storage_async-storage')
    implementation project(':react-native-clipboard_clipboard')
    implementation project(':react-native-encrypted-storage')
    implementation project(':react-native-geolocation-service')
    implementation project(':react-native-get-random-values')
    implementation project(':react-native-permissions')
    implementation project(':react-native-safe-area-context')

    // Google Play Services Location for FusedLocationProviderClient
    implementation "com.google.android.gms:play-services-location:21.2.0"

    // AndroidX & Core libraries
    implementation "androidx.appcompat:appcompat:1.6.1"
    implementation "androidx.core:core:1.12.0"

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}


